name: DemoQA Automation Tests

on:
  #cron-job to automatically trigger workflow at the specified date and time
  schedule:
    - cron: '0 0 * * 1'

  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:          # allows manual trigger from GitHub UI

    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options: [ chrome, firefox, edge, safari ]
      headless:
        description: 'Run in headless mode'
        required: true
        default: 'true'
        type: choice
        options: [ 'true', 'false' ]
      env:
        description: 'Environment to test (qa, prod)'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - prod
      tag:
        description: 'Tag to use (e.g., @smoke, @regression)'
        required: false
        default: 'smoke'

# ── Grant write access to GITHUB_TOKEN ───────────────────────────────────────
permissions:
  contents: write
  actions: read
  checks: write

# ── Concurrency ─────────────────────────────────────────────────────────────────
# Cancel in-progress runs on the same branch when a new push arrives.
# Prevents multiple pipelines fighting over the same environment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17 (matches pom.xml compiler settings)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Install Chrome (latest stable)
      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable

      # 4. Run tests — headless + CI flags passed as system properties
      - name: Run Selenium tests
        run: |
          mvn test \
            -Dbrowser=chrome \
            -Dheadless=true \
            -Dci.environment=true \
            -Dusername=${{ secrets.DEMOQA_USERNAME }} \
            -Dpassword=${{ secrets.DEMOQA_PASSWORD }} \
            --no-transfer-progress

      # 5. Upload Allure raw results (used to generate the report)
      - name: Upload Allure results
        if: always()            # run even if tests fail
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/

      # 6. Upload failure screenshots (only when tests fail)
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: target/screenshots/

      # 7. Generate and publish the Allure HTML report
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: false