name: DemoQA Automation Tests

on:
  #cron-job to automatically trigger workflow at the specified date and time
  schedule:
    - cron: '0 0 * * 1'

  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:          # allows manual trigger from GitHub UI

    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options: [ chrome, firefox, edge, safari ]
      headless:
        description: 'Run in headless mode'
        required: true
        default: 'true'
        type: choice
        options: [ 'true', 'false' ]
      env:
        description: 'Environment to test (qa, prod)'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - prod
      tag:
        description: 'Tag to use (e.g., @smoke, @regression)'
        required: false
        default: 'smoke'

# ── Grant write access to GITHUB_TOKEN ───────────────────────────────────────
permissions:
  contents: write
  actions: read
  checks: write

# ── Concurrency ─────────────────────────────────────────────────────────────────
# Cancel in-progress runs on the same branch when a new push arrives.
# Prevents multiple pipelines fighting over the same environment.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Shell runs at runtime when all contexts are fully available.
      # Write resolved values to GITHUB_OUTPUT so every subsequent
      # step can read them via steps.setup.outputs.<name>
      - name: Resolve run parameters
        id: setup
        run: |
          # ── Environment ─────────────────────────────────────────────
          # Read the raw input value directly from the shell environment
          RAW_ENV="${{ github.event.inputs.environment }}"

          # If empty (push/PR trigger has no inputs) → default to 'qa'
          if [ -z "$RAW_ENV" ]; then
            TARGET_ENV="qa"
          else
            TARGET_ENV="$RAW_ENV"
          fi

          # ── Headless ──────────────────────────────────────────────────
          RAW_HEADLESS="${{ github.event.inputs.headless }}"
          if [ -z "$RAW_HEADLESS" ]; then
            RUN_HEADLESS="true"
          else
            RUN_HEADLESS="$RAW_HEADLESS"
          fi

          # ── Write to GITHUB_OUTPUT ────────────────────────────────────────────
          echo "target_env=$TARGET_ENV"     >> $GITHUB_OUTPUT
          echo "run_headless=$RUN_HEADLESS" >> $GITHUB_OUTPUT

          # ── Print so you can verify in logs ───────────────────────────────────
          echo "================================================"
          echo "  github.event_name = ${{ github.event_name }}"
          echo "  RAW INPUT ENV     = $RAW_ENV"
          echo "  RESOLVED ENV      = $TARGET_ENV"
          echo "  RESOLVED HEADLESS = $RUN_HEADLESS"
          echo "================================================"

      # 2. Set up Java 17 (matches pom.xml compiler settings)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Install Chrome (latest stable)
      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update -q
          sudo apt-get install -y google-chrome-stable
          
      # ── Credentials: each env has its own GitHub Secret ───
      # Secrets setup:    Settings → Secrets → Actions → New repository secret
      # Required secrets: QA_USERNAME, QA_PASSWORD
      #                   STAGING_USERNAME, STAGING_PASSWORD
      #                   PROD_USERNAME, PROD_PASSWORD
      - name: Resolve credentials for [${{ steps.setup.outputs.target_env }}]
        id: creds
        run: |
          ENV="${{ steps.setup.outputs.target_env }}"
          echo "Resolving credentials for env=[$ENV]"

          if [ "$ENV" = "qa" ]; then
            echo "username=${{ secrets.DEMOQA_PASSWORD }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.DEMOQA_USERNAME }}" >> $GITHUB_OUTPUT

          elif [ "$ENV" = "staging" ]; then
            echo "username=${{ secrets.STAGING_USERNAME }}"  >> $GITHUB_OUTPUT
            echo "password=${{ secrets.STAGING_PASSWORD }}"  >> $GITHUB_OUTPUT

          elif [ "$ENV" = "prod" ]; then
            echo "username=${{ secrets.PROD_USERNAME }}" >> $GITHUB_OUTPUT
            echo "password=${{ secrets.PROD_PASSWORD }}" >> $GITHUB_OUTPUT
          fi

      # 4. Run tests — headless + CI flags passed as system properties
      - name: Run tests on [${{ steps.setup.outputs.target_env }}]
        run: |
          mvn test \
            -Dbrowser=chrome \
            -Dheadless=${{ steps.setup.outputs.run_headless }} \
            -Denv=${{ steps.setup.outputs.target_env }} \
            -Dci.environment=true \
            -Dusername=${{ steps.creds.outputs.username }} \
            -Dpassword=${{ steps.creds.outputs.password }} \
            --no-transfer-progress

      # 5. Upload Allure raw results (used to generate the report)
      - name: Get Allure history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
            ref: gh-pages
            path: gh-pages

      - name: Upload Allure results
        if: always()            # run even if tests fail
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ env.TARGET_ENV }}-run${{ github.run_number }}
          path: target/allure-results/

      # 6. Upload failure screenshots (only when tests fail)
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ env.TARGET_ENV }}-run${{ github.run_number }}
          path: target/screenshots/

      # 7. Generate and publish the Allure HTML report
      - name: Generate Allure Report
        if: always()
        uses: simple-elf/allure-report-action@master
        with:
          allure_results: target/allure-results
          gh_pages: gh-pages
          allure_report: allure-report
          allure_history: allure-history

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

            # ── 8. Post report URL to job summary ───────────────────────────────────
      - name: Post Allure report URL to summary
        if: always()
        run: |
             echo "## ✅ Allure Test Report" >> $GITHUB_STEP_SUMMARY
             echo "" >> $GITHUB_STEP_SUMMARY
             echo "📊 [View Allure Report](https://quang-phan-epam.github.io/java-selenium-maven/${{ github.run_number }})" >> $GITHUB_STEP_SUMMARY
             echo "" >> $GITHUB_STEP_SUMMARY
             echo "Environment: ${{env.TARGET_ENV}}" >> $GITHUB_STEP_SUMMARY
             echo "Headless: ${{env.RUN_HEADLESS}}" >> $GITHUB_STEP_SUMMARY
             echo "🔢 Run number: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
             echo "🌿 Branch: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
             echo "💬 Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY