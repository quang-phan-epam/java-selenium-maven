# ── Application ───────────────────────────
env                  = prod
base.url             = https://demoqa-prod.com
bookstore.url        = https://demoqa-prod.com/books
frames.url           = https://demoqa-prod.com/frames
alerts.url           = https://demoqa-prod.com/alerts
upload.url           = https://demoqa-prod.com/upload-download
select.url           = https://demoqa-prod.com/select-menu

# Credentials — never commit real values.
# GitHub Actions injects these via Repository Secrets:
#   Settings → Secrets → Actions → New repository secret
# mvn test -Dusername=${{ secrets.DEMOQA_USERNAME }} -Dpassword=${{ secrets.DEMOQA_PASSWORD }}
user.username=selenium-java-test
user.password=Test@1234

# ── Browser ────────────────────────────────
# Overridden to 'chrome' + headless=true by GitHub Actions workflow
browser=chrome
headless=false

# ── Timeouts (seconds) ─────────────────────
implicit.wait=0
explicit.wait=15
page.load.timeout=30
ci.timeout.seconds   = 30
