# ── Application ───────────────────────────
env                  = qa
base.url             = https://demoqa.com
bookstore.url        = https://demoqa.com/books
login.url            = https://demoqa.com/login
frames.url           = https://demoqa.com/frames
alerts.url           = https://demoqa.com/alerts
upload.url           = https://demoqa.com/upload-download
